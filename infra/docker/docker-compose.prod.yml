services:
  caddy:
    image: caddy:2.8-alpine
    container_name: crucible_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - collab
    networks:
      - crucible-network

  web:
    build:
      context: ../../
      dockerfile: apps/web/Dockerfile
    container_name: crucible_web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://${DOMAIN:-localhost}/api/v1
      - NEXT_PUBLIC_COLLAB_WS_URL=wss://${DOMAIN:-localhost}/ws/collab
    networks:
      - crucible-network

  api:
    build:
      context: ../../
      dockerfile: apps/api/Dockerfile
    container_name: crucible_api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crucible}:${POSTGRES_PASSWORD:-crucible_prod_pass}@postgres:5432/${POSTGRES_DB:-crucible_prod}
      - REDIS_URL=redis://redis:6379
      - JUDGE0_URL=http://judge0-server:2358
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_WS_URL=${LIVEKIT_WS_URL}
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=${S3_BUCKET:-crucible-recordings}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-crucible_minio_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-crucible_minio_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crucible-network
      - judge0-network

  collab:
    build:
      context: ../../
      dockerfile: apps/collab/Dockerfile
    container_name: crucible_collab
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-crucible}:${POSTGRES_PASSWORD:-crucible_prod_pass}@postgres:5432/${POSTGRES_DB:-crucible_prod}
      - REDIS_URL=redis://redis:6379
      - COLLAB_PORT=1234
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - crucible-network

  postgres:
    image: postgres:16-alpine
    container_name: crucible_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crucible}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crucible_prod_pass}
      POSTGRES_DB: ${POSTGRES_DB:-crucible_prod}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crucible} -d ${POSTGRES_DB:-crucible_prod}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crucible-network

  redis:
    image: redis:7-alpine
    container_name: crucible_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crucible-network

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: crucible_minio_prod
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-crucible_minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-crucible_minio_secret}
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - crucible-network

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: crucible_judge0_server_prod
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    networks:
      - judge0-network

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: crucible_judge0_workers_prod
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    restart: unless-stopped
    networks:
      - judge0-network

volumes:
  caddy_data:
  caddy_config:
  postgres_prod_data:
  redis_prod_data:
  minio_prod_data:

networks:
  crucible-network:
    name: crucible-network
  judge0-network:
    name: judge0-network
    internal: true

