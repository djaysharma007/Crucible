# Judge0 CE Configuration for Crucible
# Execution limits per PRD Section 6.4: CPU time, wall time, memory, output size, no network

CPU_TIME_LIMIT=2.0
CPU_EXTRA_TIME=0.5
WALL_TIME_LIMIT=5.0
MEMORY_LIMIT=128000
STACK_LIMIT=64000
MAX_PROCESSES_AND_OR_THREADS=60
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=false
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=false
MAX_FILE_SIZE=65536
NUMBER_OF_RUNS=1

# Security & Sandboxing
ENABLE_NETWORK=false
REDIRECT_STDERR_TO_STDOUT=false

# Persistence & Redis connection
POSTGRES_HOST=postgres
POSTGRES_PORT=5432
POSTGRES_USER=crucible
POSTGRES_PASSWORD=crucible_dev_pass
POSTGRES_DB=crucible_dev

REDIS_HOST=redis
REDIS_PORT=6379
