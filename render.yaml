# Render Blueprint specification for Crucible Zero-Cost Deployment
# Both services run on the Render Free Web Service plan ($0/mo)
services:
  - type: web
    name: crucible-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

      # Auto-generated internal cryptographic secrets (no user choice needed)
      - key: SESSION_SECRET
        generateValue: true
      - key: ROOM_TOKEN_SECRET
        generateValue: true
      - key: COLLAB_TOKEN_SECRET
        generateValue: true
      - key: DEMO_INTERVIEWER_PASSWORD
        generateValue: true

      # Neon PostgreSQL (Free Tier)
      # DATABASE_URL = Pooled endpoint (ends with -pooler.neon.tech)
      # DIRECT_URL = Direct endpoint (does NOT contain -pooler)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Upstash Redis (Free Tier)
      - key: REDIS_URL
        sync: false

      # LiveKit Cloud (Free Build Plan)
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # Code Execution (RapidAPI Judge0 CE Free Plan)
      - key: EXECUTION_PROVIDER
        value: rapidapi
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_JUDGE0_HOST
        value: judge0-ce.p.rapidapi.com

      # Storage (Supabase Storage S3-Compatible API - Free Tier)
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_BUCKET
        value: crucible-recordings
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false

      # Transactional Email (Brevo Free Plan - Single Verified Sender)
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Crucible

      # Vercel Frontend URL & CORS (configured after Vercel deployment)
      - key: APP_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: crucible-collab
    runtime: docker
    dockerfilePath: ./apps/collab/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

      # Inherited from crucible-api service
      - key: REDIS_URL
        fromService:
          type: web
          name: crucible-api
          envVarKey: REDIS_URL
      - key: COLLAB_TOKEN_SECRET
        fromService:
          type: web
          name: crucible-api
          envVarKey: COLLAB_TOKEN_SECRET
