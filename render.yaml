# Render Blueprint specification for Crucible Zero-Cost Deployment
# Both services run on the Render Free Web Service plan ($0/mo)
services:
  - type: web
    name: crucible-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: phase-7-free-deployment
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: COLLAB_TOKEN_SECRET
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: EXECUTION_PROVIDER
        value: rapidapi
      - key: RAPIDAPI_KEY
        sync: false
      - key: RAPIDAPI_JUDGE0_HOST
        value: judge0-ce.p.rapidapi.com
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_S3_BUCKET
        value: crucible-recordings
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Crucible
      - key: APP_URL
        sync: false

  - type: web
    name: crucible-collab
    runtime: docker
    dockerfilePath: ./apps/collab/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    branch: phase-7-free-deployment
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        sync: false
      - key: COLLAB_TOKEN_SECRET
        sync: false
